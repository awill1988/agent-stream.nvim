name: Render Media
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: media-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.28.5/install
      - run: nix shell github:NixOS/nixpkgs/aa48d347080940b8a2b8d2f48228674e280a3514#vhs github:NixOS/nixpkgs/aa48d347080940b8a2b8d2f48228674e280a3514#ffmpeg -c make demo-media
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: showcase-media
          path: |
            demo/showcase.mp4
            demo/showcase.gif
          if-no-files-found: error
